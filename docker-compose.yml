services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  countries-api:
    build: ./services/countries-api
    ports: ["5001:8080"]
    environment:
      ConnectionStrings__CountriesDb: "Server=sql;Database=CountriesDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      sql: { condition: service_healthy }
    healthcheck: &api-health
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  eligibility-api:
    build: ./services/eligibility-api
    ports: ["5003:8080"]
    environment:
      ConnectionStrings__EligibilityDb: "Server=sql;Database=EligibilityDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      sql: { condition: service_healthy }
    healthcheck: *api-health

  requests-api:
    build: ./services/requests-api
    ports: ["5002:8080"]
    environment:
      ConnectionStrings__RequestsDb: "Server=sql;Database=RequestsDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Services__CountriesApi: "http://countries-api:8080/"
      Services__EligibilityApi: "http://eligibility-api:8080/"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    depends_on:
      countries-api: { condition: service_healthy }
      eligibility-api: { condition: service_healthy }
    healthcheck: *api-health